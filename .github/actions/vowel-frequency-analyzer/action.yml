name: Vowel Frequency Analyzer
description: Counts vowels in a text file and logs the result to README.md
inputs:
  file:
    description: Path to the text file
    required: true
runs:
  using: docker
  image: docker://ghcr.io/adnaan-0310/vowel-frequency-analyzer:latest
  entrypoint: /app/.github/scripts/entrypoint.sh
  env:
    FILE: ${{ inputs.file }}
